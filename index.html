<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coverage — AI Infrastructure Explorer</title>

  <!-- ⚡ favicon: inline SVG data URI (no external request, works on file://) -->
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M13 2 4.5 13.5H11l-1 8.5L19.5 10H13z' fill='%235b3ee0'/%3E%3C/svg%3E"
  />

  <!-- Shared editorial design tokens + components (masthead, chips, ledger, colophon). -->
  <link rel="stylesheet" href="shared/theme.css" />

  <style>
    /* Front-page-only layout. Tokens + components come from theme.css —
       nothing here redefines a token or an .aie-* component. */

    /* NOTE: only padding-BOTTOM here. This used to say `padding: 0 0 8px`,
       which silently cancelled .aie-wrap's horizontal padding and pinned the
       whole page flush to the viewport edge. */
    .front { padding-bottom: var(--s-2); }

    .front-header { margin: var(--s-6) 0 0; max-width: 20ch; }
    .front-eyebrow { display: block; margin: 0 0 var(--s-3); }
    .front-headline {
      margin: 0 0 var(--s-4);
      font-family: var(--display);
      font-size: clamp(34px, 6vw, var(--fs-3xl));
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.02;
      color: var(--ink);
    }
    .standfirst {
      margin: 0;
      max-width: 54ch;
      font-family: var(--display);
      font-size: var(--fs-lg);
      line-height: 1.5;
      color: var(--muted);
    }
    .standfirst b { font-weight: 600; color: var(--ink); }
    .standfirst a {
      color: var(--violet);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    /* At-a-glance counts, above the ledger. */
    .front-stats { margin-top: var(--s-7); }

    /* Coverage ledger. */
    .ledger-section { margin-top: var(--s-8); }
    .ledger-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--s-3);
      padding-bottom: var(--s-3);
      border-bottom: 1px solid var(--border-strong);
    }
    .ledger-count { font-family: var(--mono); font-size: var(--fs-2xs); color: var(--muted); }
    .empty-state {
      margin-top: var(--s-4);
      padding: var(--s-8) var(--s-5);
      text-align: center;
      border: 1px dashed var(--border-strong);
      border-radius: var(--r-card);
      background: var(--card);
    }
    .empty-state p {
      margin: 0;
      font-family: var(--display);
      font-size: var(--fs-lg);
      line-height: 1.5;
      color: var(--muted);
    }

    /* Filter chips. The shared .aie-chip carries the look; this is layout only.
       NOTE: no `font: inherit` here — that shorthand resets font-size and used
       to blow the 11px chips up to the 17px body size. */
    .ledger-filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--s-2);
      margin: var(--s-5) 0 var(--s-4);
    }
    .ledger-filters .lf-label {
      font-family: var(--mono);
      font-size: var(--fs-2xs);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-right: var(--s-1);
    }
    .ledger-filters .lf-group {
      display: flex; flex-wrap: wrap; gap: var(--s-1); align-items: center;
    }
    .ledger-filters .lf-sep {
      width: 1px; height: 16px; background: var(--border); margin: 0 var(--s-2);
    }

    /* Ticker + kind cells in the ledger table. */
    .ledger-section .aie-ledger .l-ticker { white-space: nowrap; }
    .ledger-section .aie-ledger .aie-ledger-title a {
      color: inherit; text-decoration: none;
    }

    /* Sub-label above the "called, not yet written up" stub rows. */
    .ledger-stub-note {
      font-family: var(--mono);
      font-size: var(--fs-2xs);
      letter-spacing: 0.02em;
      color: var(--muted);
      margin: var(--s-7) 0 var(--s-2);
    }
    .ledger-nomatch {
      padding: var(--s-6);
      font-family: var(--sans);
      font-size: var(--fs-sm);
      color: var(--muted);
    }

    @media (max-width: 768px) {
      .front-header { margin-top: var(--s-5); max-width: none; }
      .front-stats { margin-top: var(--s-6); }
      .ledger-section { margin-top: var(--s-7); }
      .ledger-filters { gap: var(--s-1); }
    }
  </style>
</head>
<body>
  <div class="gradient-border" id="gradientBorder"></div>

  <!-- Shared top nav (theme.css). Rendered by AIE.renderNav('coverage') at boot. -->
  <div id="topNav"></div>

  <main class="aie-wrap front">
    <!-- Page header — this page is the memo index, nothing more. The Desk
         (desk.html) is the front door; this is the reading room. -->
    <header class="front-header">
      <span class="aie-label front-eyebrow">My coverage desk / 2026</span>
      <h1 class="front-headline">Everything I've written up.</h1>
      <p class="standfirst">Newest first. The live working view — prices,
        the map, this week's calls — is on <a href="desk.html">the Desk</a>.</p>
    </header>

    <!-- At-a-glance counts. Filled from real data at boot; no hardcoded numbers. -->
    <section class="front-stats" aria-label="Coverage at a glance">
      <div class="aie-stat-grid" id="frontStats"></div>
    </section>

    <!-- Coverage ledger — memo rows + "not yet written up" stubs, built at boot. -->
    <section class="ledger-section" aria-label="Written notes">
      <div class="ledger-head">
        <span class="aie-label">Written notes</span>
        <span class="ledger-count" id="ledgerCount">Nothing written up yet</span>
      </div>
      <div class="ledger-filters" id="ledgerFilters"></div>
      <div id="ledgerBody"></div>
    </section>
  </main>

  <footer class="aie-colophon" id="colophon"><!-- disclaimer from desk.meta at boot --></footer>

  <!-- data.js MUST load first: defines window.AIE_DATA -->
  <script src="data.js"></script>
  <!-- Shared AIE namespace (seeding, nav, formatters). After data.js. -->
  <script src="shared/common.js"></script>

  <script>
    (function () {
      "use strict";
      var DATA = window.AIE_DATA || {};
      var AIE = window.AIE;

      // Shared boot: seed localStorage, paint the category gradient, render nav.
      AIE.seed();
      AIE.paintGradientBorder();
      AIE.renderNav("coverage");

      function el(tag, className, text) {
        var n = document.createElement(tag);
        if (className) n.className = className;
        if (text != null) n.textContent = text;
        return n;
      }
      var tickers = DATA.tickers || [];
      var desk = DATA.desk || {};
      var dmeta = desk.meta || {};

      // ---- Colophon: disclaimer straight from desk.meta (fallback if absent). ----
      var colo = document.getElementById("colophon");
      if (colo) {
        colo.appendChild(el("strong", null, "AI Infrastructure Explorer"));
        colo.appendChild(document.createTextNode(" — "));
        colo.appendChild(document.createTextNode(
          dmeta.disclaimer ||
          "Personal research tool — not investment advice."));
        colo.appendChild(document.createTextNode(" · "));
        var designLink = el("a", null, "Design reference");
        designLink.href = "design.html";
        colo.appendChild(designLink);
      }

      /* ================================================================
         At-a-glance counts. Every figure is READ FROM THE DATA — nothing
         here is hardcoded, so the panel can never drift from the store.
         The lead stat is the one the operator actually acts on.
         ================================================================ */
      function statBlock(value, label, note, lead) {
        var d = el("div", "aie-stat" + (lead ? " aie-stat--lead" : ""));
        d.appendChild(el("span", "aie-stat-value", value));
        d.appendChild(el("span", "aie-stat-label", label));
        if (note) d.appendChild(el("span", "aie-stat-note", note));
        return d;
      }

      function renderFrontStats() {
        var host = document.getElementById("frontStats");
        if (!host) return;
        var memoStore = DATA.memos || {};
        var memoList = memoStore.memos || [];
        var verdicts = (desk.verdicts || []);
        var called = {};
        verdicts.forEach(function (v) { called[v.ticker] = true; });
        var written = {};
        memoList.forEach(function (m) { written[m.ticker] = true; });
        var awaiting = verdicts.filter(function (v) { return !written[v.ticker]; }).length;

        host.innerHTML = "";
        host.appendChild(statBlock(
          String(memoList.length), "Names written up",
          awaiting ? awaiting + " more called, not yet written" : "every call has a note",
          true));
        host.appendChild(statBlock(
          String(Object.keys(called).length), "Live calls",
          dmeta.reviewedAt ? "reviewed " + AIE.fmtDate(dmeta.reviewedAt) : null));
        // Real layers only. `unsorted` is a triage bucket with no flowRole —
        // counting it would claim 11 layers when the chain has 10.
        var cats = DATA.categories || {};
        var layers = Object.keys(cats).filter(function (id) {
          return cats[id] && cats[id].flowRole;
        }).length;
        host.appendChild(statBlock(
          String(tickers.length), "Companies tracked",
          layers + " layers of the chain"));
      }

      /* ================================================================
         Coverage ledger. One row per published memo (newest first) plus
         muted "verdict only" stubs for Core names the desk has a stance
         on but hasn't written up yet. Filters (kind + rating) act on the
         memo rows; the reserved empty-state stays when there are no memos.
         ================================================================ */
      var tickerCategory = {};
      tickers.forEach(function (t) { tickerCategory[t.ticker] = t.category; });
      function catColor(sym) { return AIE.categoryColor(tickerCategory[sym], null); }

      var KIND_LABEL = { coverage: "Coverage", update: "Update", "exit-note": "Exit note" };
      function kindLabel(k) { return KIND_LABEL[k] || k || "Note"; }

      var ledgerFilter = { kind: null, rating: null, theme: null };

      function publishedDesc(a, b) {
        var da = a.publishedAt || a.updatedAt || "";
        var db = b.publishedAt || b.updatedAt || "";
        return db < da ? -1 : (db > da ? 1 : 0);
      }

      // A ledger row. `stub` rows are muted "verdict only" links to the watchlist.
      function ledgerRow(o) {
        var tr = el("tr", o.stub ? "is-stub" : "is-link");

        var dCell = el("td", "aie-ledger-date", o.date || "—");
        dCell.setAttribute("data-label", "Date");
        tr.appendChild(dCell);

        var tCell = el("td", "l-ticker");
        var chip = el("span", "aie-chip aie-chip--ticker", o.ticker);
        var color = catColor(o.ticker);
        if (color) chip.style.setProperty("--chip-accent", color);
        tCell.appendChild(chip);
        tr.appendChild(tCell);

        var kCell = el("td");
        kCell.setAttribute("data-label", "Type");
        if (o.kind) kCell.appendChild(el("span", "aie-chip", kindLabel(o.kind)));
        else kCell.appendChild(document.createTextNode("—"));
        tr.appendChild(kCell);

        var titleCell = el("td", "aie-ledger-title");
        var a = el("a", null, o.title);
        a.href = o.href;
        titleCell.appendChild(a);
        tr.appendChild(titleCell);

        var rCell = el("td");
        rCell.setAttribute("data-label", "Call");
        if (o.rating) rCell.appendChild(el("span", "aie-badge aie-stance--" + o.rating, AIE.stanceLabel(o.rating)));
        else rCell.appendChild(document.createTextNode("—"));
        tr.appendChild(rCell);

        // Whole-row click convenience (the title is the real, keyboard-accessible link).
        tr.addEventListener("click", function (ev) {
          if (ev.target.tagName !== "A") window.location.href = o.href;
        });
        return tr;
      }

      function buildLedgerTable(memoRows, stubRows) {
        var table = el("table", "aie-ledger");
        var thead = el("thead");
        var htr = el("tr");
        ["Date", "Ticker", "Type", "Title", "Call"].forEach(function (h) {
          htr.appendChild(el("th", null, h));
        });
        thead.appendChild(htr);
        table.appendChild(thead);

        var tbody = el("tbody");
        memoRows.forEach(function (m) {
          tbody.appendChild(ledgerRow({
            date: m.publishedAt ? AIE.fmtDate(m.publishedAt) : "—",
            ticker: m.ticker,
            kind: m.kind,
            title: m.title || m.id,
            rating: m.rating,
            href: "memo.html?id=" + encodeURIComponent(m.id),
            stub: false
          }));
        });
        stubRows.forEach(function (v) {
          tbody.appendChild(ledgerRow({
            date: "—",
            ticker: v.ticker,
            kind: null,
            title: "Called — not written up yet",
            rating: v.stance,
            href: "desk.html#chapter-watchlist",
            stub: true
          }));
        });
        table.appendChild(tbody);
        return table;
      }

      // Distinct values in author-preferred order, filtered to those present.
      function distinctIn(items, key, order) {
        var seen = {};
        items.forEach(function (it) { if (it[key]) seen[it[key]] = true; });
        return order.filter(function (v) { return seen[v]; });
      }

      function renderFilterGroup(label, dimension, values, labelFn) {
        var group = el("div", "lf-group");
        group.appendChild(el("span", "lf-label", label));
        function chip(text, value) {
          var active = ledgerFilter[dimension] === value;
          var b = el("button", "aie-chip" + (active ? " is-active" : ""), text);
          b.type = "button";
          b.addEventListener("click", function () {
            ledgerFilter[dimension] = value;
            renderLedger();
          });
          return b;
        }
        group.appendChild(chip("All", null));
        values.forEach(function (v) {
          var text = labelFn ? labelFn(v) : (v === "exit-note" ? "Exit note" : v);
          group.appendChild(chip(text, v));
        });
        return group;
      }

      // Distinct ticker categories present across the given memos, ordered by the
      // categories' value-chain layer so the theme chips read Supply → Demand.
      function themesInMemos(memos) {
        var seen = {};
        memos.forEach(function (m) { var c = tickerCategory[m.ticker]; if (c) seen[c] = true; });
        return Object.keys(DATA.categories)
          .filter(function (id) { return seen[id]; })
          .sort(function (a, b) {
            return (DATA.categories[a].layer || 0) - (DATA.categories[b].layer || 0);
          });
      }
      function themeLabel(id) {
        var c = DATA.categories && DATA.categories[id];
        return (c && c.label) || id;
      }

      function renderLedger() {
        var store = DATA.memos || {};
        var memos = (store.memos || []).slice().sort(publishedDesc);
        var verdicts = (DATA.desk && DATA.desk.verdicts) || [];

        var countEl = document.getElementById("ledgerCount");
        var filtersEl = document.getElementById("ledgerFilters");
        var bodyEl = document.getElementById("ledgerBody");
        if (!bodyEl) return;

        countEl.textContent = memos.length
          ? memos.length + (memos.length === 1 ? " note" : " notes")
          : "Nothing written up yet";

        // Filters — only meaningful when memos exist.
        filtersEl.innerHTML = "";
        if (memos.length) {
          var kinds = distinctIn(memos, "kind", ["coverage", "update", "exit-note"]);
          var ratings = distinctIn(memos, "rating", ["act", "accumulate", "watch", "pass"]);
          var themes = themesInMemos(memos);
          var groups = [];
          if (kinds.length > 1) groups.push(renderFilterGroup("Type", "kind", kinds));
          if (ratings.length > 1) groups.push(renderFilterGroup("Call", "rating", ratings, AIE.stanceLabel));
          if (themes.length > 1) groups.push(renderFilterGroup("Layer", "theme", themes, themeLabel));
          groups.forEach(function (g, i) {
            if (i) filtersEl.appendChild(el("span", "lf-sep"));
            filtersEl.appendChild(g);
          });
        }

        var filteredMemos = memos.filter(function (m) {
          return (!ledgerFilter.kind || m.kind === ledgerFilter.kind)
              && (!ledgerFilter.rating || m.rating === ledgerFilter.rating)
              && (!ledgerFilter.theme || tickerCategory[m.ticker] === ledgerFilter.theme);
        });

        // "Verdict only" stubs: Core names with a desk verdict but no memo.
        // The theme filter is a ticker attribute, so it narrows stubs too; kind/
        // rating are memo attributes and leave stubs untouched (as before).
        var memoTickers = {};
        memos.forEach(function (m) { memoTickers[m.ticker] = true; });
        var stubs = verdicts.filter(function (v) {
          return !memoTickers[v.ticker]
              && (!ledgerFilter.theme || tickerCategory[v.ticker] === ledgerFilter.theme);
        });

        bodyEl.innerHTML = "";

        // Empty-state stays when there are no memos at all.
        if (!memos.length) {
          var empty = el("div", "empty-state");
          empty.appendChild(el("p", null, "Nothing written up yet. The next weekly review starts the first note."));
          bodyEl.appendChild(empty);
          if (stubs.length) {
            bodyEl.appendChild(el("p", "ledger-stub-note",
              stubs.length + " name" + (stubs.length === 1 ? "" : "s") +
              " already have a call, but no write-up yet:"));
            bodyEl.appendChild(buildLedgerTable([], stubs));
          }
          return;
        }

        if (!filteredMemos.length && !stubs.length) {
          bodyEl.appendChild(el("div", "ledger-nomatch", "Nothing matches those filters."));
          return;
        }
        bodyEl.appendChild(buildLedgerTable(filteredMemos, stubs));
      }

      renderFrontStats();
      renderLedger();
    })();
  </script>
</body>
</html>
